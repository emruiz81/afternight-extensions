name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-repository:
    name: Package Repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Run tool tests
        run: python3 -m unittest discover -s tests

      - name: Build package assets
        run: python3 tools/build_repository_assets.py --output-dir dist

      - name: Verify generated index
        run: |
          updated_at="$(python3 -c 'import json; print(json.load(open("index.json", encoding="utf-8"))["updated_at"])')"
          python3 tools/generate_index.py \
            --packages-root packages \
            --assets-dir dist \
            --updated-at "$updated_at" \
            --output /tmp/index.json
          diff -u index.json /tmp/index.json

  afternight-validator:
    name: AfterNight Package Validator
    needs: package-repository
    if: ${{ vars.AFTERNIGHT_VALIDATOR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: "6.10.1"
      PYTHON_VERSION: "3.14.3"
      PYTHON_BUILD_DATE: "20260211"
      AFTERNIGHT_VALIDATOR_REPOSITORY: ${{ vars.AFTERNIGHT_VALIDATOR_REPOSITORY || 'emruiz81/afternight' }}
      AFTERNIGHT_VALIDATOR_REF: ${{ vars.AFTERNIGHT_VALIDATOR_REF || 'extensions_sdk' }}

    steps:
      - name: Check out extension repository
        uses: actions/checkout@v6
        with:
          path: afternight-extensions

      - name: Check out AfterNight validator source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.AFTERNIGHT_VALIDATOR_REPOSITORY }}
          ref: ${{ env.AFTERNIGHT_VALIDATOR_REF }}
          submodules: recursive
          path: afternight
          token: ${{ secrets.AFTERNIGHT_VALIDATOR_TOKEN || github.token }}

      - name: Install system dependencies
        working-directory: afternight
        run: |
          chmod +x build/scripts/linux/install_ci_apt_deps.sh
          ./build/scripts/linux/install_ci_apt_deps.sh

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v5
        with:
          path: afternight/Qt6
          key: qt-linux-${{ env.QT_VERSION }}-clang-linux_gcc_64-v1

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        working-directory: afternight
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 -O Qt6

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: afternight/Qt6
          key: qt-linux-${{ env.QT_VERSION }}-clang-linux_gcc_64-v1

      - name: Restore embedded Python cache
        id: cache-python
        uses: actions/cache/restore@v5
        with:
          path: afternight/python/python/tools
          key: python-linux-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_BUILD_DATE }}-v2

      - name: Install embedded Python
        if: steps.cache-python.outputs.cache-hit != 'true'
        working-directory: afternight
        run: |
          cd build/scripts/python
          chmod +x setup_python_linux.sh
          ./setup_python_linux.sh

      - name: Save embedded Python cache
        if: steps.cache-python.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: afternight/python/python/tools
          key: python-linux-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_BUILD_DATE }}-v2

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            afternight/vcpkg/installed
            afternight/vcpkg/packages
          key: vcpkg-linux-release-v6
          restore-keys: |
            vcpkg-linux-release-

      - name: Install vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        working-directory: afternight/vcpkg
        run: |
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg install crashpad --triplet x64-linux-release
          ./vcpkg install cmark-gfm --triplet x64-linux-release
          ./vcpkg install eigen3 --triplet x64-linux-release

      - name: Save vcpkg cache
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            afternight/vcpkg/installed
            afternight/vcpkg/packages
          key: vcpkg-linux-release-v6

      - name: Restore KDDockWidgets cache
        id: cache-kddockwidgets
        uses: actions/cache/restore@v5
        with:
          path: afternight/kddockwidgets/build
          key: kddockwidgets-linux-release-${{ env.QT_VERSION }}-${{ hashFiles('afternight/kddockwidgets/CMakeLists.txt') }}-v2

      - name: Build KDDockWidgets
        if: steps.cache-kddockwidgets.outputs.cache-hit != 'true'
        working-directory: afternight
        run: |
          QT_DIR="$(pwd)/Qt6/${{ env.QT_VERSION }}/gcc_64"
          QT_DIR_CMAKE="$QT_DIR/lib/cmake/Qt6"
          INSTALL_DIR="$(pwd)/kddockwidgets/build/install_clang"
          BUILD_DIR="$(pwd)/kddockwidgets/build/build_clang"
          SRC_DIR="$(pwd)/kddockwidgets"

          rm -rf "$BUILD_DIR" "$INSTALL_DIR"

          cmake -G "Ninja" -B "$BUILD_DIR" -S "$SRC_DIR" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DQt6_DIR="$QT_DIR_CMAKE" \
            -DKDDockWidgets_QT6=ON \
            -DKDDockWidgets_QTQUICK=OFF \
            -DKDDockWidgets_FLUTTER=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DKDDockWidgets_FRONTENDS="qtwidgets"

          cmake --build "$BUILD_DIR" --config Release -j$(nproc)
          cmake --install "$BUILD_DIR" --config Release

      - name: Save KDDockWidgets cache
        if: steps.cache-kddockwidgets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: afternight/kddockwidgets/build
          key: kddockwidgets-linux-release-${{ env.QT_VERSION }}-${{ hashFiles('afternight/kddockwidgets/CMakeLists.txt') }}-v2

      - name: Generate AfterNight project files
        working-directory: afternight/build/premake
        run: |
          chmod +x configure_linux.sh
          ./configure_linux.sh

      - name: Build AfterNight dependencies
        working-directory: afternight/build/make-linux/3rdparty
        run: make -j$(nproc) config=release_x64

      - name: Build AfterNight runtime
        working-directory: afternight/build/make-linux
        run: make -j$(nproc) config=release_x64

      - name: Deploy AfterNight runtime dependencies
        working-directory: afternight/build/scripts/linux
        run: |
          chmod +x 05a-deploy_all_deps_release.sh _deploy_binaries.sh
          ./05a-deploy_all_deps_release.sh

      - name: Build package validator test binary
        working-directory: afternight/build/make-linux/tests
        run: make -j$(nproc) config=release_x64 Test_ProcessFramework

      - name: Validate extension packages with AfterNight
        working-directory: afternight/bin/clang/release
        env:
          AFTERNIGHT_EXTENSION_REPOSITORY_ROOT: ${{ github.workspace }}/afternight-extensions
        run: |
          export LD_LIBRARY_PATH="$(pwd):$(pwd)/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./Test_ProcessFramework \
            --gtest_filter=ExtensionManagerTest.ExternalExtensionRepositoryPassesAppSidePackageValidator
