name: Validate Repository

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-repository:
    name: Package Repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Install Python signing dependencies
        run: python3 -m pip install --require-hashes -r tools/signing/requirements.lock

      - name: Run tool tests
        run: python3 -m unittest discover -s tests

      - name: Build published package assets for validation only
        run: python3 tools/build_repository_assets.py --output-dir dist

      - name: Verify checked-in index matches rebuilt assets
        run: |
          updated_at="$(python3 -c 'import json; print(json.load(open("index.json", encoding="utf-8"))["updated_at"])')"
          python3 tools/generate_index.py \
            --packages-root packages \
            --assets-dir dist \
            --updated-at "$updated_at" \
            --output /tmp/index.json
          diff -u index.json /tmp/index.json
