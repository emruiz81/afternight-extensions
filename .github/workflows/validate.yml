name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-repository:
    name: Package Repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Run tool tests
        run: python3 -m unittest discover -s tests

      - name: Build package assets
        run: python3 tools/build_repository_assets.py --output-dir dist

      - name: Verify generated index
        run: |
          updated_at="$(python3 -c 'import json; print(json.load(open("index.json", encoding="utf-8"))["updated_at"])')"
          python3 tools/generate_index.py \
            --packages-root packages \
            --assets-dir dist \
            --updated-at "$updated_at" \
            --output /tmp/index.json
          diff -u index.json /tmp/index.json

  discover-package-tests:
    name: Discover Package Tests
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Discover package test suites
        id: discover
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import os

          packages = []
          for tests_dir in sorted(pathlib.Path("packages").glob("*/tests")):
              if any(path.name.startswith("test") and path.suffix == ".py" for path in tests_dir.rglob("*.py")):
                  packages.append({"package": tests_dir.parent.name})

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("count=" + str(len(packages)) + "\n")
              handle.write("matrix=" + json.dumps({"include": packages}) + "\n")
          PY

  package-tests:
    name: Package Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: discover-package-tests
    if: needs.discover-package-tests.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-package-tests.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check out AfterNight Python SDK context
        run: git clone --depth 1 https://github.com/emruiz81/afternight.git ../afternight

      - name: Create package test environment
        run: |
          python -m venv .venv-package-tests
          . .venv-package-tests/bin/activate
          python -m pip install --upgrade pip
          if [ -f "packages/${{ matrix.package }}/tests/requirements.txt" ]; then
            python -m pip install -r "packages/${{ matrix.package }}/tests/requirements.txt"
          fi

      - name: Run package tests
        run: |
          . .venv-package-tests/bin/activate
          python -m unittest discover -s "packages/${{ matrix.package }}/tests"
