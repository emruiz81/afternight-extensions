name: Publish Extension Release (GitHub Release)

run-name: Publish ${{ inputs.package_id }} ${{ inputs.version }} as a GitHub Release

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Publishable package id. This dropdown is static in the GitHub UI; the run summary shows the repository-discovered package and version list.
        required: true
        type: choice
        options:
          - cosmic_clarity
          - graxpert
          - veralux
      version:
        description: Version to publish. Must match package/extension.json and repository.json release metadata. The run summary shows the declared release versions discovered from the repository.
        required: true
        type: string
      draft:
        description: Create or keep the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: Replace assets on an existing GitHub Release; use only before a release is announced
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-extension-release-live-index
  cancel-in-progress: false

env:
  LIVE_INDEX_BRANCH: live
  LIVE_INDEX_PATH: index.json

jobs:
  publish:
    name: Publish GitHub Release for ${{ inputs.package_id }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: List publishable packages and versions
        run: python3 tools/release_metadata.py --list-available --github-step-summary

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Install Python signing dependencies
        run: python3 -m pip install --require-hashes -r tools/signing/requirements.lock

      - name: Resolve release metadata and tag
        id: release
        run: |
          python3 tools/release_metadata.py \
            --package-id "${{ inputs.package_id }}" \
            --version "${{ inputs.version }}" \
            --expected-github-repository "${{ github.repository }}" \
            --github-output

      - name: Build published package assets for release
        run: python3 tools/build_repository_assets.py --output-dir dist

      - name: Verify checked-in index matches release assets
        run: |
          updated_at="$(python3 -c 'import json; print(json.load(open("index.json", encoding="utf-8"))["updated_at"])')"
          python3 tools/generate_index.py \
            --packages-root packages \
            --assets-dir dist \
            --updated-at "$updated_at" \
            --output /tmp/index.json
          diff -u index.json /tmp/index.json

      - name: Sign release asset sidecars
        if: ${{ inputs.draft == false }}
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          VERSION: ${{ inputs.version }}
          SIGNING_KEY_ID: ${{ vars.AFTERNIGHT_EXTENSION_SIGNING_KEY_ID }}
          AFTERNIGHT_EXTENSION_SIGNING_KEY_ED25519_SEED_B64: ${{ secrets.AFTERNIGHT_EXTENSION_SIGNING_KEY_ED25519_SEED_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_ID:-}" ]; then
            echo "AFTERNIGHT_EXTENSION_SIGNING_KEY_ID repository variable is required for non-draft publication." >&2
            exit 1
          fi
          python3 tools/sign_repository_assets.py \
            --assets-dir dist \
            --package-id "$PACKAGE_ID" \
            --version "$VERSION" \
            --key-id "$SIGNING_KEY_ID" \
            --public-keys tools/signing/official_keys.json

      - name: Select release archive and metadata sidecar
        id: assets
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          VERSION: ${{ inputs.version }}
          DRAFT_RELEASE: ${{ inputs.draft }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import uuid

          package_id = os.environ["PACKAGE_ID"]
          version = os.environ["VERSION"]
          dist = pathlib.Path("dist")
          files = []
          for metadata_path in sorted(dist.glob("*.metadata.json")):
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata.get("package_id") != package_id or metadata.get("version") != version:
                  continue
              archive_path = dist / metadata["name"]
              if not archive_path.is_file():
                  raise SystemExit(f"Missing archive for {metadata_path}: {archive_path}")
              files.append(str(archive_path))
              files.append(str(metadata_path))
              signature_path = pathlib.Path(str(archive_path) + ".sig")
              if signature_path.is_file():
                  files.append(str(signature_path))
              elif os.environ.get("DRAFT_RELEASE") != "true":
                  raise SystemExit(f"Missing signature sidecar for non-draft release asset: {signature_path}")

          if not files:
              raise SystemExit(f"No built assets found for {package_id} {version}")

          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          delimiter = f"EOF_{uuid.uuid4().hex}"
          with output_path.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"asset_files<<{delimiter}\n")
              for item in files:
                  handle.write(f"{item}\n")
              handle.write(f"{delimiter}\n")
          PY

      - name: Write GitHub Release notes
        env:
          CHANGELOG: ${{ steps.release.outputs.changelog }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          notes = os.environ.get("CHANGELOG", "").strip()
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Check existing GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          if python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          release_tag = os.environ["RELEASE_TAG"]
          releases = json.loads(pathlib.Path("releases.json").read_text(encoding="utf-8"))
          release = next((item for item in releases if item.get("tag_name") == release_tag), None)
          if release is None:
              raise SystemExit(1)
          pathlib.Path("existing-release.json").write_text(
              json.dumps(release, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          then
            release_id="$(python3 -c 'import json; print(json.load(open("existing-release.json", encoding="utf-8"))["id"])')"
            release_is_draft="$(python3 -c 'import json; print(str(json.load(open("existing-release.json", encoding="utf-8"))["draft"]).lower())')"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
            echo "release_is_draft=$release_is_draft" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload assets
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          ASSET_FILES: ${{ steps.assets.outputs.asset_files }}
        run: |
          mapfile -t asset_files <<< "$ASSET_FILES"
          flags=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            flags+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${asset_files[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            "${flags[@]}"

      - name: Replace GitHub Release assets in place
        if: steps.existing.outputs.exists == 'true' && inputs.replace_existing_assets == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.existing.outputs.release_id }}
          ASSET_FILES: ${{ steps.assets.outputs.asset_files }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.parse

          repository = os.environ["GITHUB_REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          asset_files = [
              pathlib.Path(line)
              for line in os.environ["ASSET_FILES"].splitlines()
              if line.strip()
          ]

          assets_result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{repository}/releases/{release_id}/assets?per_page=100",
              ],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          if assets_result.returncode != 0:
              print(assets_result.stderr, file=sys.stderr)
              raise SystemExit(assets_result.returncode)
          release_assets = {
              asset.get("name"): asset
              for asset in json.loads(assets_result.stdout)
              if isinstance(asset, dict)
          }

          for local_path in asset_files:
              existing = release_assets.get(local_path.name)
              if existing is not None:
                  delete_result = subprocess.run(
                      [
                          "gh",
                          "api",
                          "--method",
                          "DELETE",
                          f"repos/{repository}/releases/assets/{existing['id']}",
                      ],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  if delete_result.returncode != 0:
                      print(delete_result.stderr, file=sys.stderr)
                      raise SystemExit(delete_result.returncode)

              upload_url = (
                  f"https://uploads.github.com/repos/{repository}/releases/"
                  f"{release_id}/assets?name={urllib.parse.quote(local_path.name)}"
              )
              upload_result = subprocess.run(
                  [
                      "curl",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--location",
                      "--request",
                      "POST",
                      "--header",
                      f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "--header",
                      "X-GitHub-Api-Version: 2022-11-28",
                      "--header",
                      "Content-Type: application/octet-stream",
                      "--data-binary",
                      f"@{local_path}",
                      upload_url,
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if upload_result.returncode != 0:
                  print(upload_result.stderr, file=sys.stderr)
                  raise SystemExit(upload_result.returncode)
          PY

      - name: Refresh signed metadata sidecars on existing GitHub Release
        if: steps.existing.outputs.exists == 'true' && inputs.replace_existing_assets == false && inputs.draft == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.existing.outputs.release_id }}
          ASSET_FILES: ${{ steps.assets.outputs.asset_files }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.parse

          repository = os.environ["GITHUB_REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          asset_files = [
              pathlib.Path(line)
              for line in os.environ["ASSET_FILES"].splitlines()
              if line.strip()
          ]

          assets_result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{repository}/releases/{release_id}/assets?per_page=100",
              ],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          if assets_result.returncode != 0:
              print(assets_result.stderr, file=sys.stderr)
              raise SystemExit(assets_result.returncode)
          release_assets = {
              asset.get("name"): asset
              for asset in json.loads(assets_result.stdout)
              if isinstance(asset, dict)
          }

          for local_path in asset_files:
              existing = release_assets.get(local_path.name)
              if local_path.name.endswith(".tar.zst"):
                  if existing is None:
                      raise SystemExit(
                          f"{local_path.name}: existing release is missing the archive; "
                          "re-run with replace_existing_assets=true only if it is safe to upload archives"
                      )
                  continue

              if existing is not None:
                  delete_result = subprocess.run(
                      [
                          "gh",
                          "api",
                          "--method",
                          "DELETE",
                          f"repos/{repository}/releases/assets/{existing['id']}",
                      ],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  if delete_result.returncode != 0:
                      print(delete_result.stderr, file=sys.stderr)
                      raise SystemExit(delete_result.returncode)

              upload_url = (
                  f"https://uploads.github.com/repos/{repository}/releases/"
                  f"{release_id}/assets?name={urllib.parse.quote(local_path.name)}"
              )
              upload_result = subprocess.run(
                  [
                      "curl",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--location",
                      "--request",
                      "POST",
                      "--header",
                      f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "--header",
                      "X-GitHub-Api-Version: 2022-11-28",
                      "--header",
                      "Content-Type: application/octet-stream",
                      "--data-binary",
                      f"@{local_path}",
                      upload_url,
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if upload_result.returncode != 0:
                  print(upload_result.stderr, file=sys.stderr)
                  raise SystemExit(upload_result.returncode)
          PY

      - name: Resolve selected GitHub Release id
        id: selected_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib

          release_tag = os.environ["RELEASE_TAG"]
          releases = json.loads(pathlib.Path("releases.json").read_text(encoding="utf-8"))
          release = next((item for item in releases if item.get("tag_name") == release_tag), None)
          if release is None:
              raise SystemExit(f"release {release_tag} was not found after create/upload step")
          print(f"release_id={release['id']}")
          print(f"release_is_draft={str(release.get('draft')).lower()}")
          PY

      - name: Verify selected GitHub Release assets match local files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.selected_release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
          EXISTING_RELEASE: ${{ steps.existing.outputs.exists }}
          ASSET_FILES: ${{ steps.assets.outputs.asset_files }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          repository = os.environ["GITHUB_REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          release_tag = os.environ["RELEASE_TAG"]
          asset_files = [
              pathlib.Path(line)
              for line in os.environ["ASSET_FILES"].splitlines()
              if line.strip()
          ]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          assets_result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{repository}/releases/{release_id}/assets?per_page=100",
              ],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          if assets_result.returncode != 0:
              print(assets_result.stderr, file=sys.stderr)
              raise SystemExit(assets_result.returncode)
          release_assets = {
              asset.get("name"): asset
              for asset in json.loads(assets_result.stdout)
              if isinstance(asset, dict)
          }

          failures = []
          with tempfile.TemporaryDirectory() as temp:
              download_dir = pathlib.Path(temp)
              for local_path in asset_files:
                  release_asset = release_assets.get(local_path.name)
                  if release_asset is None:
                      failures.append(
                          f"{local_path.name}: not present on release {release_tag}"
                      )
                      continue
                  downloaded = download_dir / local_path.name
                  with downloaded.open("wb") as output:
                      result = subprocess.run(
                          [
                              "gh",
                              "api",
                              f"repos/{repository}/releases/assets/{release_asset['id']}",
                              "-H",
                              "Accept: application/octet-stream",
                          ],
                          check=False,
                          stdout=output,
                          stderr=subprocess.PIPE,
                      )
                  stderr = result.stderr.decode("utf-8", errors="replace")
                  if result.returncode != 0:
                      failures.append(
                          f"{local_path.name}: could not download release asset\n"
                          f"{stderr.strip()}"
                      )
                      continue
                  if sha256(downloaded) != sha256(local_path):
                      failures.append(f"{local_path.name}: uploaded asset hash does not match local build")
                  downloaded.unlink(missing_ok=True)

          if failures:
              print("GitHub Release assets do not match this build:", file=sys.stderr)
              print("\n\n".join(failures), file=sys.stderr)
              if (
                  os.environ.get("EXISTING_RELEASE") == "true"
                  and os.environ.get("REPLACE_EXISTING_ASSETS") != "true"
              ):
                  print(
                      "\nRe-run with replace_existing_assets=true only if this release "
                      "has not been announced or consumed.",
                      file=sys.stderr,
                  )
              raise SystemExit(1)
          PY

      - name: Update existing GitHub Release metadata and visibility
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.selected_release.outputs.release_id }}
          EXISTING_RELEASE_IS_DRAFT: ${{ steps.existing.outputs.release_is_draft }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
        run: |
          notes="$(cat release-notes.md)"
          target_draft="${{ inputs.draft }}"
          if [ "$EXISTING_RELEASE_IS_DRAFT" != "true" ] && [ "$target_draft" = "true" ]; then
            target_draft="false"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="$RELEASE_TITLE" \
            -f body="$notes" \
            -F draft="$target_draft" \
            -F prerelease="${{ inputs.prerelease }}"

      - name: Generate repository index candidate
        if: ${{ inputs.draft == false }}
        run: |
          updated_at="$(python3 -c 'import json; print(json.load(open("index.json", encoding="utf-8"))["updated_at"])')"
          python3 tools/generate_index.py \
            --packages-root packages \
            --assets-dir dist \
            --updated-at "$updated_at" \
            --output /tmp/candidate-index.json

      - name: Build live index update
        if: ${{ inputs.draft == false }}
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$LIVE_INDEX_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LIVE_INDEX_BRANCH"
          fi

          if git show "origin/$LIVE_INDEX_BRANCH:$LIVE_INDEX_PATH" > /tmp/current-live-index.json 2>/dev/null; then
            python3 tools/update_live_index.py \
              --candidate-index /tmp/candidate-index.json \
              --current-live-index /tmp/current-live-index.json \
              --package-id "$PACKAGE_ID" \
              --output /tmp/live-index.json
          else
            python3 tools/update_live_index.py \
              --candidate-index /tmp/candidate-index.json \
              --package-id "$PACKAGE_ID" \
              --output /tmp/live-index.json
          fi

      - name: Verify selected live index entry is signed
        if: ${{ inputs.draft == false }}
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          package_id = os.environ["PACKAGE_ID"]
          index = json.loads(pathlib.Path("/tmp/live-index.json").read_text(encoding="utf-8"))
          package = next(
              (item for item in index.get("extensions", []) if item.get("id") == package_id),
              None,
          )
          if package is None:
              raise SystemExit(f"live index does not contain selected package {package_id}")
          latest_version = package.get("latest_version")
          release = next(
              (item for item in package.get("releases", []) if item.get("version") == latest_version),
              None,
          )
          if release is None:
              raise SystemExit(f"live index selected package {package_id} has no latest release {latest_version}")
          failures = []
          for asset in release.get("assets", []):
              if asset.get("signature_state") != "verified":
                  failures.append(f"{asset.get('name', '<unknown>')}: signature_state is not verified")
              for key in ("signature_algorithm", "signature_key_id", "signature"):
                  if not asset.get(key):
                      failures.append(f"{asset.get('name', '<unknown>')}: missing {key}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Verify live index download URLs
        if: ${{ inputs.draft == false }}
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import time

          index_path = pathlib.Path("/tmp/live-index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          urls = [
              asset["download_url"]
              for package in index.get("extensions", [])
              for release in package.get("releases", [])
              for asset in release.get("assets", [])
          ]
          if not urls:
              raise SystemExit("live index contains no release asset download URLs")

          failures = []
          for url in urls:
              for attempt in range(1, 7):
                  result = subprocess.run(
                      [
                          "curl",
                          "--fail",
                          "--location",
                          "--silent",
                          "--show-error",
                          "--head",
                          "--max-time",
                          "30",
                          url,
                      ],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  if result.returncode == 0:
                      break
                  if attempt < 6:
                      time.sleep(5 * attempt)
              else:
                  failures.append(f"{url}\n{result.stderr.strip()}")

          if failures:
              print("One or more live index assets are not downloadable:", file=sys.stderr)
              print("\n\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Publish live repository index
        if: ${{ inputs.draft == false }}
        run: |
          set -euo pipefail
          worktree="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin "$LIVE_INDEX_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LIVE_INDEX_BRANCH"
            git worktree add -B "$LIVE_INDEX_BRANCH" "$worktree" "origin/$LIVE_INDEX_BRANCH"
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout --orphan "$LIVE_INDEX_BRANCH"
            git -C "$worktree" rm -r -f --ignore-unmatch .
          fi

          cp /tmp/live-index.json "$worktree/$LIVE_INDEX_PATH"
          cat > "$worktree/README.md" <<'EOF'
          # AfterNight Extension Live Index

          This branch is updated by the `Publish Extension Release` workflow after
          GitHub Release assets have been uploaded and their download URLs have
          been checked. Do not edit it by hand.
          EOF

          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add "$LIVE_INDEX_PATH" README.md
          if git -C "$worktree" diff --cached --quiet; then
            echo "Live index is already up to date."
            exit 0
          fi

          git -C "$worktree" commit -m "Publish live extension index for ${{ inputs.package_id }} ${{ inputs.version }}"
          git -C "$worktree" push origin "HEAD:$LIVE_INDEX_BRANCH"
